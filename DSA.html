<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Professional - Advanced Math Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        input:focus { border-color: #3b82f6 !important; ring: 2px #3b82f6; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-20">

    <div class="max-w-6xl mx-auto px-4 pt-10">
        <div class="text-center mb-12">
            <h1 class="text-4xl font-black text-slate-900 tracking-tighter uppercase italic">DSA asosidagi Eri</h1>
            <p class="text-slate-500 font-medium">Matematik chegaralar va mukammal verifikatsiya tizimi</p>
        </div>

        <div class="glass border border-slate-200 rounded-[2rem] p-8 shadow-xl mb-10">
            <h2 class="text-xl font-bold mb-6 flex items-center text-slate-800">
                <span class="bg-blue-600 text-white w-8 h-8 rounded-lg flex items-center justify-center mr-3 shadow-lg shadow-blue-200 text-sm">01</span>
                Kerakli parametrlar
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div>
                    <label class="block text-[11px] font-black text-slate-400 uppercase tracking-wider mb-2">P (Katta tub son)</label>
                    <input id="p" type="number" value="83" oninput="validateSystem()" class="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl p-4 mono text-lg outline-none transition-all">
                    <div id="p-status" class="mt-2 text-[10px] font-bold"></div>
                </div>
                <div>
                    <label class="block text-[11px] font-black text-slate-400 uppercase tracking-wider mb-2">Q (P-1 ning bo'luvchisi)</label>
                    <input id="q" type="number" value="41" oninput="validateSystem()" class="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl p-4 mono text-lg outline-none transition-all">
                    <div id="q-status" class="mt-2 text-[10px] font-bold"></div>
                </div>
                <div>
                    <label class="block text-[11px] font-black text-slate-400 uppercase tracking-wider mb-2">H (Generator asosi: 1 < h < P-1)</label>
                    <input id="h" type="number" value="2" oninput="validateSystem()" class="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl p-4 mono text-lg outline-none transition-all">
                    <div id="h-status" class="mt-2 text-[10px] font-bold"></div>
                </div>
            </div>
            <div class="mt-8 flex flex-col md:flex-row items-center justify-between bg-blue-50 p-6 rounded-2xl border border-blue-100">
                <div>
                    <p class="text-xs text-blue-500 font-bold uppercase mb-1">Hisoblangan Generator (g):</p>
                    <div id="g-val" class="mono text-3xl font-black text-blue-700">g = ?</div>
                </div>
                <button onclick="calculateG()" class="bg-blue-600 hover:bg-blue-700 text-white font-black px-10 py-4 rounded-xl transition-all shadow-lg shadow-blue-200 uppercase">Sistemani faollashtirish</button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 mb-10">
            <div class="bg-white rounded-[2rem] p-8 shadow-xl border-b-8 border-indigo-500">
                <h3 class="text-2xl font-black text-indigo-600 mb-6 italic uppercase">Alice (Qabul qiluvchi)</h3>
                <div class="p-5 bg-indigo-50 rounded-2xl mb-4">
                    <label class="block text-[10px] font-bold text-indigo-400 uppercase mb-2">Maxfiy Kalit (x_a < Q)</label>
                    <input id="xa" type="number" value="5" class="w-full bg-white border-2 border-indigo-100 rounded-xl p-3 mono outline-none">
                </div>
                <button onclick="genKey('a')" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl uppercase hover:bg-indigo-700 transition-all">Ochiq kalitni yaratish</button>
                <div id="res-a" class="hidden mt-4 text-center">
                    <div id="ya-val" class="mono text-xl font-black text-indigo-900 bg-indigo-50 py-3 rounded-xl border-2 border-dashed border-indigo-200"></div>
                </div>
            </div>

            <div class="bg-white rounded-[2rem] p-8 shadow-xl border-b-8 border-emerald-500">
                <h3 class="text-2xl font-black text-emerald-600 mb-6 italic uppercase">Bob (Yuboruvchi)</h3>
                <div class="p-5 bg-emerald-50 rounded-2xl mb-4">
                    <label class="block text-[10px] font-bold text-emerald-400 uppercase mb-2">Maxfiy Kalit (x_b < Q)</label>
                    <input id="xb" type="number" value="7" class="w-full bg-white border-2 border-emerald-100 rounded-xl p-3 mono outline-none">
                </div>
                <button onclick="genKey('b')" class="w-full bg-emerald-600 text-white font-bold py-4 rounded-xl uppercase hover:bg-emerald-700 transition-all">Ochiq kalitni yaratish</button>
                <div id="res-b" class="hidden mt-4 text-center">
                    <div id="yb-val" class="mono text-xl font-black text-emerald-900 bg-emerald-50 py-3 rounded-xl border-2 border-dashed border-emerald-200"></div>
                </div>
            </div>
        </div>

        <div class="bg-slate-900 rounded-[2.5rem] p-10 shadow-2xl text-white mb-10">
            <h2 class="text-3xl font-black italic uppercase mb-10 text-yellow-400 border-l-4 border-yellow-400 pl-4">Raqamli Imzo Operatsiyasi</h2>
            
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
                <div class="space-y-6">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="col-span-2">
                            <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase">Xabar (M)</label>
                            <textarea id="messageText" oninput="updateHash()" placeholder="Xabarni kiriting..." class="w-full bg-slate-800 border-2 border-slate-700 rounded-2xl p-4 mono h-24 outline-none focus:border-yellow-500"></textarea>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase">H(M) Hash (1 < H < P)</label>
                            <input id="hm" type="number" readonly class="w-full bg-slate-950 border-2 border-slate-800 rounded-xl p-3 mono text-yellow-400">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase">Tasodifiy k (0 < k < Q)</label>
                            <input id="k" type="number" value="3" class="w-full bg-slate-800 border-2 border-slate-700 rounded-xl p-3 mono outline-none focus:border-yellow-500">
                        </div>
                    </div>
                    <button onclick="sign()" class="w-full bg-yellow-500 text-slate-950 font-black py-4 rounded-xl uppercase hover:bg-yellow-400 transition-all">Bob: Imzo Yaratish</button>
                    
                    <!-- r va s ni qo'lda tahrirlash uchun inputlar qo'shildi -->
                    <div id="sig-display" class="p-6 bg-slate-800 rounded-2xl border border-slate-700 mono text-sm hidden">
                        <div class="flex flex-col gap-3">
                            <div class="flex justify-between items-center text-yellow-400 font-bold mb-2">IMZO TAYYOR (Tahrirlash mumkin):</div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="text-[9px] text-slate-400">r qiymati:</label>
                                    <input id="input-r" type="number" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-yellow-500">
                                </div>
                                <div>
                                    <label class="text-[9px] text-slate-400">s qiymati:</label>
                                    <input id="input-s" type="number" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-yellow-500">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="space-y-6">
                    <div id="status-container" class="min-h-[160px] flex items-center justify-center border-2 border-dashed border-slate-700 rounded-[2rem] bg-slate-800/30 transition-all duration-500">
                        <div id="final-status" class="text-center font-black text-2xl italic text-slate-600 uppercase tracking-widest">KUTILMOQDA...</div>
                    </div>
                    <button onclick="verify()" class="w-full bg-white text-slate-900 font-black py-4 rounded-xl uppercase hover:bg-slate-200 transition-all">Alice: Imzoni Tekshirish</button>
                </div>
            </div>

            <div id="math-logs" class="mt-10 p-8 bg-black/40 rounded-[2rem] border border-slate-700 hidden">
                <h3 class="text-yellow-500 font-black uppercase text-xs mb-6 tracking-[0.2em] italic flex items-center">
                    <span class="w-2 h-2 bg-yellow-500 rounded-full mr-2"></span> Matematik Hisoblash Jarayoni
                </h3>
                <div id="log-content" class="mono text-sm text-slate-300 space-y-4"></div>
            </div>
        </div>
    </div>

    <script>
        let state = { g: 0n, ya: 0n, yb: 0n, r: 0n, s: 0n };

        function mPow(base, exp, mod) {
            let res = 1n;
            base = BigInt(base) % BigInt(mod);
            exp = BigInt(exp);
            let m = BigInt(mod);
            while (exp > 0n) {
                if (exp % 2n === 1n) res = (res * base) % m;
                base = (base * base) % m;
                exp = exp / 2n;
            }
            return res;
        }

        function modInv(a, m) {
            let m0 = BigInt(m), t, q;
            let x0 = 0n, x1 = 1n;
            let a_val = BigInt(a) % BigInt(m);
            if (m0 === 1n) return 0n;
            while (a_val > 1n) {
                q = a_val / m0;
                t = m0; m0 = a_val % m0; a_val = t;
                t = x0; x0 = x1 - q * x0; x1 = t;
            }
            return x1 < 0n ? x1 + BigInt(m) : x1;
        }

        function isPrime(n) {
            let bN = BigInt(n);
            if (bN < 2n) return false;
            for (let i = 2n; i * i <= bN; i++) if (bN % i === 0n) return false;
            return true;
        }

        function validateSystem() {
            const p = BigInt(document.getElementById('p').value);
            const q = BigInt(document.getElementById('q').value);
            const h = BigInt(document.getElementById('h').value);
            const pStatus = document.getElementById('p-status');
            const qStatus = document.getElementById('q-status');
            const hStatus = document.getElementById('h-status');
            pStatus.innerHTML = isPrime(p) ? '<span class="text-green-500">✓ P Tub</span>' : '<span class="text-red-500">✗ P Tub emas</span>';
            let qHtml = isPrime(q) ? '<span class="text-green-500">✓ Q Tub</span>' : '<span class="text-red-500">✗ Q Tub emas</span>';
            if ((p - 1n) % q !== 0n) qHtml += '<br><span class="text-red-400">! Q soni (P-1) ni bo\'lishi shart</span>';
            qStatus.innerHTML = qHtml;
            hStatus.innerHTML = (h <= 1n || h >= p - 1n) ? '<span class="text-red-500">✗ H chegaradan tashqarida</span>' : '<span class="text-green-500">✓ H to\'g\'ri</span>';
        }

        function calculateG() {
            const p = BigInt(document.getElementById('p').value);
            const q = BigInt(document.getElementById('q').value);
            const h = BigInt(document.getElementById('h').value);
            if ((p - 1n) % q !== 0n) { alert("Q soni (P-1) ni bo'lishi shart!"); return; }
            state.g = mPow(h, (p - 1n) / q, p);
            if (state.g <= 1n) { alert("g > 1 bo'lishi shart! Boshqa 'h' tanlang."); return; }
            document.getElementById('g-val').innerText = `g = ${state.g}`;
        }

        function genKey(user) {
            if(!state.g) calculateG();
            const p = BigInt(document.getElementById('p').value);
            const q = BigInt(document.getElementById('q').value);
            const x = BigInt(document.getElementById('x' + user).value);
            if (x <= 0n || x >= q) { alert(`Xato: Maxfiy kalit 0 va ${q} oralig'ida bo'lishi kerak!`); return; }
            const y = mPow(state.g, x, p);
            if(user === 'a') state.ya = y; else state.yb = y;
            document.getElementById('res-' + user).classList.remove('hidden');
            document.getElementById('y' + user + '-val').innerText = `y_${user} = ${y}`;
        }

        // YANGILANGAN HASH FUNKSIYASI (1 < H < P)
        function updateHash() {
            let str = document.getElementById('messageText').value;
            let p = BigInt(document.getElementById('p').value);
            if (!str) { document.getElementById('hm').value = ""; return; }
            let hash = 0n;
            for (let i = 0; i < str.length; i++) {
                hash = (hash * 31n + BigInt(str.charCodeAt(i))) % p;
            }
            // 1 < hash < p oralig'iga tushirish
            let result = (hash % (p - 2n)) + 2n;
            document.getElementById('hm').value = result.toString();
        }

        function sign() {
            const hmVal = document.getElementById('hm').value;
            const p = BigInt(document.getElementById('p').value);
            const q = BigInt(document.getElementById('q').value);
            const xb = BigInt(document.getElementById('xb').value);
            const k = BigInt(document.getElementById('k').value);
            if(!state.yb || !hmVal) { alert("Parametrlarni va xabarni tekshiring!"); return; }
            
            state.r = mPow(state.g, k, p) % q;
            const kInv = modInv(k, q);
            const hm = BigInt(hmVal);
            state.s = (kInv * (hm + xb * state.r)) % q;

            // Ko'rsatish va tahrirlash maydonlariga yozish
            document.getElementById('sig-display').classList.remove('hidden');
            document.getElementById('input-r').value = state.r.toString();
            document.getElementById('input-s').value = state.s.toString();

            const logs = document.getElementById('math-logs');
            logs.classList.remove('hidden');
            document.getElementById('log-content').innerHTML = `
                <div class="p-4 bg-yellow-500/5 border border-yellow-500/20 rounded-xl">
                    <p class="text-yellow-500 font-bold mb-2 uppercase text-[10px]">Bob: Imzolash bosqichlari</p>
                    <p>r = (${state.g}^${k} mod ${p}) mod ${q} = <b class="text-white">${state.r}</b></p>
                    <p>k⁻¹ mod ${q} = <b class="text-white">${kInv}</b></p>
                    <p>s = ${kInv} * (${hm} + ${xb}*${state.r}) mod ${q} = <b class="text-white">${state.s}</b></p>
                </div>`;
        }

        function verify() {
            // Imzoni inputlardan (tahrirlangan bo'lishi mumkin) olish
            const rVal = document.getElementById('input-r').value;
            const sVal = document.getElementById('input-s').value;
            
            if(!rVal || !sVal) { alert("Imzo mavjud emas!"); return; }
            
            const r = BigInt(rVal);
            const s = BigInt(sVal);
            const p = BigInt(document.getElementById('p').value);
            const q = BigInt(document.getElementById('q').value);
            const hm = BigInt(document.getElementById('hm').value);

            const w = modInv(s, q);
            const u1 = (hm * w) % q;
            const u2 = (r * w) % q;
            const v = ((mPow(state.g, u1, p) * mPow(state.yb, u2, p)) % p) % q;

            const isCorrect = (v === r);
            
            document.getElementById('log-content').innerHTML += `
                <div class="p-4 bg-blue-500/5 border border-blue-500/20 rounded-xl mt-4">
                    <p class="text-blue-400 font-bold mb-2 uppercase text-[10px]">Alice: Verifikatsiya bosqichlari</p>
                    <p>w = ${s}⁻¹ mod ${q} = <b class="text-white">${w}</b></p>
                    <p>u1 = (${hm}*${w}) mod ${q} = <b class="text-white">${u1}</b> | u2 = (${r}*${w}) mod ${q} = <b class="text-white">${u2}</b></p>
                    <p>v = ((${state.g}^${u1} * ${state.yb}^${u2}) mod ${p}) mod ${q} = <b class="text-white text-lg">${v}</b></p>
                    <p class="mt-2 font-bold ${isCorrect ? 'text-green-400' : 'text-red-500'}">
                        Natija: v(${v}) ${isCorrect ? '==' : '!='} r(${r})
                    </p>
                </div>`;

            const status = document.getElementById('final-status');
            const container = document.getElementById('status-container');
            status.innerText = isCorrect ? "IMZO TASDIQLANDI ✓" : "IMZO XATO ✗";
            status.className = `text-center font-black text-2xl italic uppercase tracking-widest ${isCorrect ? 'text-green-400' : 'text-red-500'}`;
            container.style.borderColor = isCorrect ? '#4ade80' : '#ef4444';
        }

        window.onload = validateSystem;
    </script>
</body>
</html>
